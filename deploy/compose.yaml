name: archive-mail

services:
  archive-mail:
    image: archive-mail:${ARCHIVE_MAIL_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: archive-mail
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    user: "${ARCHIVE_MAIL_UID:-1000}:${ARCHIVE_MAIL_GID:-1000}"
    ports:
      - "${ARCHIVE_MAIL_BIND_ADDRESS:-127.0.0.1}:${ARCHIVE_MAIL_PORT:-3001}:3001"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "${EMAIL_CLIENT_TRUST_PROXY:-false}"
      TZ: "${TZ:-UTC}"
      EMAIL_CLIENT_DATA_DIR: /data
      EMAIL_CLIENT_DATABASE_PROVIDER: postgresql
      EMAIL_CLIENT_PUBLIC_URL: "${EMAIL_CLIENT_PUBLIC_URL:-}"
      GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID:-}"
      GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET:-}"
      GMAIL_SYNC_INTERVAL_MINUTES: "${GMAIL_SYNC_INTERVAL_MINUTES:-}"
      GMAIL_SYNC_MAILBOX_ACTIONS: "${GMAIL_SYNC_MAILBOX_ACTIONS:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_ENVIRONMENT: "${PAYPAL_ENVIRONMENT:-sandbox}"
      PAYPAL_WEBHOOK_ID: "${PAYPAL_WEBHOOK_ID:-}"
      ZELLE_RECIPIENT: "${ZELLE_RECIPIENT:-}"
      ZELLE_PAYMENT_NOTE: "${ZELLE_PAYMENT_NOTE:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_MESSAGING_SERVICE_SID: "${TWILIO_MESSAGING_SERVICE_SID:-}"
      PROPERTY_GMAIL_CONNECTION_ID: "${PROPERTY_GMAIL_CONNECTION_ID:-}"
      PROPERTY_AUTOMATION_INTERVAL_MINUTES: "${PROPERTY_AUTOMATION_INTERVAL_MINUTES:-5}"
      PROPERTY_BACKUP_RETENTION: "${PROPERTY_BACKUP_RETENTION:-7}"
      Import__Enabled: "${ARCHIVE_MAIL_IMPORT_ENABLED:-true}"
      Import__DataDirectory: /data
      Import__BatchSize: "${ARCHIVE_MAIL_IMPORT_BATCH_SIZE:-1000}"
      Import__ParserConcurrency: "${ARCHIVE_MAIL_IMPORT_PARSER_CONCURRENCY:-4}"
      Import__ReadPstJobs: "${ARCHIVE_MAIL_IMPORT_READPST_JOBS:-4}"
      Import__LeaseSeconds: "${ARCHIVE_MAIL_IMPORT_LEASE_SECONDS:-120}"
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: "${POSTGRES_DB:-archive_mail}"
      PGUSER: "${POSTGRES_USER:-archive_mail}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}"
      POSTGRES_SCHEMA: "${POSTGRES_SCHEMA:-archive_mail}"
    volumes:
      - type: bind
        source: "${ARCHIVE_MAIL_DATA_DIR:?ARCHIVE_MAIL_DATA_DIR must be set in deploy/.env}"
        target: /data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 5m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres-migrate:
    image: archive-mail-migrator:${ARCHIVE_MAIL_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migrator
    container_name: archive-mail-postgres-migrate
    restart: "no"
    user: "${ARCHIVE_MAIL_UID:-1000}:${ARCHIVE_MAIL_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARCHIVE_MAIL_POSTGRES_MIGRATE_ON_DEPLOY: "${ARCHIVE_MAIL_POSTGRES_MIGRATE_ON_DEPLOY:-true}"
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: "${POSTGRES_DB:-archive_mail}"
      PGUSER: "${POSTGRES_USER:-archive_mail}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}"
      POSTGRES_SCHEMA: "${POSTGRES_SCHEMA:-archive_mail}"
    volumes:
      - type: bind
        source: "${ARCHIVE_MAIL_DATA_DIR:?ARCHIVE_MAIL_DATA_DIR must be set in deploy/.env}"
        target: /data
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - |
        set -eu
        if [ -f /data/postgres-cutover.complete ]; then
          echo "PostgreSQL cutover is already complete; preserving the live database."
        elif [ "$${ARCHIVE_MAIL_POSTGRES_MIGRATE_ON_DEPLOY}" != "true" ]; then
          echo "Automatic PostgreSQL migration is disabled."
        elif [ ! -f /data/archive-mail.sqlite ]; then
          echo "No legacy SQLite database exists; the C# service will create an empty PostgreSQL schema."
          touch /data/postgres-cutover.complete
        else
          if [ "$(psql -Atqc "SELECT to_regnamespace('$${POSTGRES_SCHEMA:-archive_mail}') IS NOT NULL")" = "t" ]; then
            backup="/data/postgres-before-cutover-$$(date -u +%Y%m%dT%H%M%SZ).dump"
            echo "Saving the existing PostgreSQL database to $$backup before cutover..."
            pg_dump --format=custom --file="$$backup"
          fi
          dotnet /app/ArchiveMail.Migrator.dll --sqlite /data/archive-mail.sqlite --reset --confirm-reset
          touch /data/postgres-cutover.complete
        fi
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17-alpine
    container_name: archive-mail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-archive_mail}"
      POSTGRES_USER: "${POSTGRES_USER:-archive_mail}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}"
    volumes:
      - type: bind
        source: "${ARCHIVE_MAIL_POSTGRES_DIR:?ARCHIVE_MAIL_POSTGRES_DIR must be set in deploy/.env}"
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
