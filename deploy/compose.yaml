name: archive-mail

services:
  archive-mail:
    image: archive-mail:${ARCHIVE_MAIL_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: archive-mail
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      postgres-migrate:
        condition: service_completed_successfully
    user: "${ARCHIVE_MAIL_UID:-1000}:${ARCHIVE_MAIL_GID:-1000}"
    ports:
      - "${ARCHIVE_MAIL_BIND_ADDRESS:-127.0.0.1}:${ARCHIVE_MAIL_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      TZ: "${TZ:-UTC}"
      EMAIL_CLIENT_HOST: 0.0.0.0
      EMAIL_CLIENT_PORT: 3001
      EMAIL_CLIENT_DATA_DIR: /data
      EMAIL_CLIENT_DEV_AUTH_BYPASS: 0
      EMAIL_CLIENT_ALLOW_REMOTE_LOGIN: "${EMAIL_CLIENT_ALLOW_REMOTE_LOGIN:-false}"
      EMAIL_CLIENT_SESSION_MINUTES: "${EMAIL_CLIENT_SESSION_MINUTES:-720}"
      EMAIL_CLIENT_PUBLIC_URL: "${EMAIL_CLIENT_PUBLIC_URL:-}"
      EMAIL_CLIENT_TRUST_PROXY: "${EMAIL_CLIENT_TRUST_PROXY:-false}"
      GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID:-}"
      GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET:-}"
      GMAIL_SYNC_INTERVAL_MINUTES: "${GMAIL_SYNC_INTERVAL_MINUTES:-}"
      GMAIL_SYNC_MAILBOX_ACTIONS: "${GMAIL_SYNC_MAILBOX_ACTIONS:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
      PAYPAL_ENVIRONMENT: "${PAYPAL_ENVIRONMENT:-sandbox}"
      PAYPAL_WEBHOOK_ID: "${PAYPAL_WEBHOOK_ID:-}"
      ZELLE_RECIPIENT: "${ZELLE_RECIPIENT:-}"
      ZELLE_PAYMENT_NOTE: "${ZELLE_PAYMENT_NOTE:-}"
      TWILIO_ACCOUNT_SID: "${TWILIO_ACCOUNT_SID:-}"
      TWILIO_AUTH_TOKEN: "${TWILIO_AUTH_TOKEN:-}"
      TWILIO_MESSAGING_SERVICE_SID: "${TWILIO_MESSAGING_SERVICE_SID:-}"
      PROPERTY_GMAIL_CONNECTION_ID: "${PROPERTY_GMAIL_CONNECTION_ID:-}"
      PROPERTY_AUTOMATION_INTERVAL_MINUTES: "${PROPERTY_AUTOMATION_INTERVAL_MINUTES:-5}"
      PROPERTY_BACKUP_RETENTION: "${PROPERTY_BACKUP_RETENTION:-7}"
      EMAIL_IMPORT_CONCURRENCY: "${EMAIL_IMPORT_CONCURRENCY:-1}"
      EMAIL_IMPORT_BATCH_SIZE: "${EMAIL_IMPORT_BATCH_SIZE:-50}"
      EMAIL_IMPORT_THROTTLE_MS: "${EMAIL_IMPORT_THROTTLE_MS:-5}"
      EMAIL_IMPORT_LATENCY_THRESHOLD_MS: "${EMAIL_IMPORT_LATENCY_THRESHOLD_MS:-250}"
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: "${POSTGRES_DB:-archive_mail}"
      PGUSER: "${POSTGRES_USER:-archive_mail}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}"
    volumes:
      - type: bind
        source: "${ARCHIVE_MAIL_DATA_DIR:?ARCHIVE_MAIL_DATA_DIR must be set in deploy/.env}"
        target: /data
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 2m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres-migrate:
    image: archive-mail:${ARCHIVE_MAIL_IMAGE_TAG:-local}
    container_name: archive-mail-postgres-migrate
    restart: "no"
    user: "${ARCHIVE_MAIL_UID:-1000}:${ARCHIVE_MAIL_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARCHIVE_MAIL_POSTGRES_MIGRATE_ON_DEPLOY: "${ARCHIVE_MAIL_POSTGRES_MIGRATE_ON_DEPLOY:-true}"
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: "${POSTGRES_DB:-archive_mail}"
      PGUSER: "${POSTGRES_USER:-archive_mail}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}"
    volumes:
      - type: bind
        source: "${ARCHIVE_MAIL_DATA_DIR:?ARCHIVE_MAIL_DATA_DIR must be set in deploy/.env}"
        target: /data
    command:
      - sh
      - -lc
      - |
        if [ "$${ARCHIVE_MAIL_POSTGRES_MIGRATE_ON_DEPLOY}" != "true" ]; then
          echo "Automatic PostgreSQL migration is disabled."
        elif [ ! -f /data/archive-mail.sqlite ]; then
          echo "No SQLite database exists yet; skipping the initial PostgreSQL migration."
        else
          npm run db:migrate:postgres -- --sqlite /data/archive-mail.sqlite --reset
        fi
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    container_name: archive-mail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-archive_mail}"
      POSTGRES_USER: "${POSTGRES_USER:-archive_mail}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env}"
    volumes:
      - type: bind
        source: "${ARCHIVE_MAIL_POSTGRES_DIR:?ARCHIVE_MAIL_POSTGRES_DIR must be set in deploy/.env}"
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
