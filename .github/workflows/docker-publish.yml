name: Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-app:
    name: Build and push archive-mail image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      # Dockerfile.synology copies the already-built apps/web/dist into the
      # image (it does not build the frontend itself), so it must exist in
      # the build context before `docker build` runs.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build shared package
        run: npm run build -w @email-client/shared

      - name: Build web frontend
        run: npm run build -w @email-client/web

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.synology
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vmudinas/emailclient_dash:latest
            ghcr.io/vmudinas/emailclient_dash:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=archive-mail
          cache-to: type=gha,mode=max,scope=archive-mail

  build-migrator:
    name: Build and push migrator image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.migrator
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vmudinas/emailclient_dash-migrator:latest
            ghcr.io/vmudinas/emailclient_dash-migrator:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
