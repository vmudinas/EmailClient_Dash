name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-backend:
    name: test-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run backend tests
        run: dotnet test apps/api-dotnet/ArchiveMail.Api.Tests/ArchiveMail.Api.Tests.csproj --configuration Release

  test-frontend:
    name: test-frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # apps/web imports @email-client/shared as a real workspace dependency
      # resolved through node_modules -> packages/shared/dist (see its
      # package.json "main"/"exports"), not via source path resolution, so
      # the shared package must be built before vitest can resolve it.
      - name: Build shared package
        run: npm run build -w @email-client/shared

      # The production build runs `tsc -b && vite build`, so a type error fails the image
      # build on main while `vitest run` alone passes -- test files are executed by vitest
      # but were never type-checked here. That gap let a type error reach main once already.
      - name: Type-check frontend
        run: npm run typecheck -w @email-client/web

      - name: Run frontend tests
        run: npm run test:run -w @email-client/web
