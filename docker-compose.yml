services:
  archive-mail:
    build: .
    container_name: archive-mail
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      # Required: config.ts defaults to 127.0.0.1, which is unreachable from outside
      # the container. 0.0.0.0 lets Fastify accept connections through the port map.
      EMAIL_CLIENT_HOST: "0.0.0.0"
      EMAIL_CLIENT_DATA_DIR: "/data"
      # Optional — uncomment and fill in (or set in a local .env file) to enable
      # Gmail sync and AI features. Leave unset to run with local mail only.
      # GMAIL_CLIENT_ID: ""
      # GMAIL_CLIENT_SECRET: ""
      # OPENAI_API_KEY: ""
      # DEEPSEEK_API_KEY: ""
      # STRIPE_SECRET_KEY: "sk_live_..."
      # STRIPE_WEBHOOK_SECRET: "whsec_..."
      # PAYPAL_CLIENT_ID: ""
      # PAYPAL_CLIENT_SECRET: ""
      # PAYPAL_ENVIRONMENT: "sandbox"
      # PAYPAL_WEBHOOK_ID: ""
      # ZELLE_RECIPIENT: "rent@example.com"
      # TWILIO_ACCOUNT_SID: "AC..."
      # TWILIO_AUTH_TOKEN: ""
      # TWILIO_MESSAGING_SERVICE_SID: "MG..."
      # PROPERTY_GMAIL_CONNECTION_ID: ""
      PROPERTY_AUTOMATION_INTERVAL_MINUTES: "5"
      PROPERTY_BACKUP_RETENTION: "7"
      EMAIL_IMPORT_CONCURRENCY: "1"
      EMAIL_IMPORT_BATCH_SIZE: "50"
      EMAIL_IMPORT_THROTTLE_MS: "5"
      EMAIL_IMPORT_LATENCY_THRESHOLD_MS: "250"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: "${POSTGRES_DB:-archive_mail}"
      PGUSER: "${POSTGRES_USER:-archive_mail}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-change-this-before-deploy}"
    volumes:
      # Point this at a real folder on the NAS's own volume (e.g. /volume1/docker/...),
      # never at a Cloud Sync / Synology Drive folder — SQLite's WAL mode requires a
      # locally-consistent filesystem.
      - /volume1/docker/archive-mail/data:/data

  postgres:
    image: postgres:17-alpine
    container_name: archive-mail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-archive_mail}"
      POSTGRES_USER: "${POSTGRES_USER:-archive_mail}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change-this-before-deploy}"
    volumes:
      - /volume1/docker/archive-mail/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
